# Local development: just Postgres. Run the app itself with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/womp_markets npm run dev
services:
  db:
    image: postgres:16-alpine
    container_name: womp-markets-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: womp_markets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devpgdata:
