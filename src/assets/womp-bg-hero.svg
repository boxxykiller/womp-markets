<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="womp-markets hero background">
  <title>womp-markets — hero background</title>
  <defs>
    <linearGradient id="h_floss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff8ad0"/>
      <stop offset="42%"  stop-color="#ff5fa8"/>
      <stop offset="76%"  stop-color="#a166ff"/>
      <stop offset="100%" stop-color="#57e6ff"/>
    </linearGradient>
    <linearGradient id="h_sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#1a0c2b"/>
      <stop offset="52%"  stop-color="#130a1f"/>
      <stop offset="100%" stop-color="#0c0614"/>
    </linearGradient>
    <radialGradient id="h_pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4f9e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff4f9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fd8ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#3fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a5bff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#9a5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h_vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".6"/>
    </radialGradient>

    <g id="h_puff">
      <rect x="-7" y="26" width="14" height="86" rx="7" fill="#ffd9a0"/>
      <path d="M-46 22 h92 l-34 76 a10 10 0 0 1 -24 0 z" fill="#ffd9a0"/>
      <path d="M-30 44 h60 M-24 66 h50 M-18 86 h34" stroke="#b9793f" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M0 -84
               c 40 0 61 22 65 47
               c 34 6 49 31 45 56
               c -4 27 -31 46 -65 49
               c -12 21 -30 30 -45 30
               c -15 0 -33 -9 -45 -30
               c -34 -3 -61 -22 -65 -49
               c -4 -25 11 -50 45 -56
               c 4 -25 25 -47 65 -47 z"
            fill="url(#h_floss)"/>
      <path d="M-78 22 c 22 -18 52 -24 78 -12 c 26 12 55 6 76 -16" stroke="#ffffff" stroke-opacity=".25" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g stroke="#1b0526" stroke-width="15" stroke-linecap="round">
        <path d="M-48 -32 l26 26 M-22 -32 l-26 26"/>
        <path d="M22 -32 l26 26 M48 -32 l-26 26"/>
      </g>
      <path d="M-34 22 q34 32 68 0" fill="none" stroke="#1b0526" stroke-width="15" stroke-linecap="round"/>
      <path d="M-10 37 l7 17 l9 -17 z" fill="#fff6fb"/>
    </g>

    <g id="h_star">
      <path d="M0 -16 l4.2 11.8 l11.8 4.2 l-11.8 4.2 l-4.2 11.8 l-4.2 -11.8 l-11.8 -4.2 l11.8 -4.2 z" fill="#fff0f8"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#h_sky)"/>

  <!-- candy haze -->
  <ellipse cx="1420" cy="300" rx="720" ry="560" fill="url(#h_pink)"/>
  <ellipse cx="320"  cy="880" rx="680" ry="520" fill="url(#h_violet)"/>
  <ellipse cx="1660" cy="900" rx="560" ry="440" fill="url(#h_cyan)"/>
  <ellipse cx="700"  cy="140" rx="520" ry="360" fill="url(#h_cyan)" opacity=".5"/>

  <!-- big watermark mark, right side -->
  <g opacity=".16"><use href="#h_puff" transform="translate(1520,560) scale(2.9) rotate(-7)"/></g>
  <!-- supporting marks -->
  <g opacity=".10"><use href="#h_puff" transform="translate(300,420) scale(1.5) rotate(9)"/></g>
  <g opacity=".08"><use href="#h_puff" transform="translate(880,880) scale(1.05) rotate(-14)"/></g>
  <g opacity=".07"><use href="#h_puff" transform="translate(1090,190) scale(0.72) rotate(16)"/></g>

  <!-- sugar dust -->
  <g fill="#ffd7ec">
    <circle cx="180"  cy="200" r="3"   opacity=".55"/>
    <circle cx="520"  cy="640" r="2.4" opacity=".45"/>
    <circle cx="760"  cy="300" r="3.4" opacity=".5"/>
    <circle cx="1180" cy="760" r="2.6" opacity=".45"/>
    <circle cx="1740" cy="240" r="3"   opacity=".5"/>
    <circle cx="1380" cy="980" r="2.4" opacity=".4"/>
    <circle cx="420"  cy="1000" r="3"  opacity=".4"/>
    <circle cx="980"  cy="120" r="2.2" opacity=".45"/>
    <circle cx="1620" cy="620" r="2.6" opacity=".4"/>
    <circle cx="120"  cy="700" r="2.4" opacity=".4"/>
  </g>
  <g opacity=".5">
    <use href="#h_star" transform="translate(640,220) scale(1.1)"/>
    <use href="#h_star" transform="translate(1810,470) scale(0.85)"/>
    <use href="#h_star" transform="translate(250,940) scale(0.9)"/>
    <use href="#h_star" transform="translate(1240,560) scale(0.7)"/>
    <use href="#h_star" transform="translate(900,1010) scale(0.65)"/>
  </g>

  <rect width="1920" height="1080" fill="url(#h_vig)"/>
</svg>
