<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="womp-markets">
  <defs>
    <!-- Same "floss" ramp as cottoncandygenocide's ccg-icon.svg, so the two
         apps read as one house. -->
    <linearGradient id="floss" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa8"/>
      <stop offset="0.45" stop-color="#a166ff"/>
      <stop offset="1" stop-color="#57e6ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#1b2b4a"/>
      <stop offset="0.6" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#080e1a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#1e2d45" stroke-width="3"/>

  <!-- Glow behind the bars -->
  <g filter="url(#soft)" opacity="0.5">
    <path d="M60 176 L104 140 L148 152 L196 84" fill="none" stroke="url(#floss)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Order-book depth bars -->
  <g fill="url(#floss)" opacity="0.9">
    <rect x="52" y="160" width="26" height="44" rx="7"/>
    <rect x="96" y="128" width="26" height="76" rx="7"/>
    <rect x="140" y="144" width="26" height="60" rx="7"/>
    <rect x="184" y="96" width="26" height="108" rx="7"/>
  </g>

  <!-- Trend line over the bars -->
  <path d="M60 172 L104 136 L148 150 L196 88" fill="none" stroke="#e8f4ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="196" cy="88" r="13" fill="#e8f4ff"/>
  <circle cx="196" cy="88" r="6" fill="#a166ff"/>
</svg>
