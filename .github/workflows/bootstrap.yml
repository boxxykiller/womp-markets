name: Bootstrap server

# One-time (re-runnable) server setup, run from the Actions tab.
#
# Everything here could be typed into an SSH session by hand; doing it from a
# workflow means the only manual step is putting the secrets into GitHub, and
# the server's configuration comes from those secrets rather than from
# whatever someone typed into nano at 3am.
#
# Safe to re-run: it installs Docker only if missing, clones only if missing,
# and never overwrites an existing .env.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: main
        required: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision and start
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_BRANCH: ${{ inputs.branch }}
          EVE_ID: ${{ secrets.EVE_CLIENT_ID }}
          EVE_SECRET: ${{ secrets.EVE_CLIENT_SECRET }}
          LE_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          CORP_IDS: ${{ secrets.ALLOWED_CORPORATION_IDS }}
          ALLIANCE_IDS: ${{ secrets.ALLOWED_ALLIANCE_IDS }}
          ADMIN_NAMES: ${{ secrets.ADMIN_CHARACTER_NAMES }}
          STRUCTURE_ID: ${{ secrets.MARKET_STRUCTURE_ID }}
          READER_NAME: ${{ secrets.MARKET_READER_CHARACTER }}
          LOCAL_USER: ${{ secrets.LOCAL_ADMIN_USERNAME }}
          LOCAL_PASS: ${{ secrets.LOCAL_ADMIN_PASSWORD }}
        run: |
          # Plain ssh instead of appleboy/ssh-action: the action silently
          # aborted this multi-line script on the server. Settings are sent
          # as shell-quoted exports ahead of the script on stdin, so values
          # never appear on a command line.
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          {
            for v in APP_PATH APP_BRANCH EVE_ID EVE_SECRET LE_EMAIL CORP_IDS ALLIANCE_IDS ADMIN_NAMES STRUCTURE_ID READER_NAME LOCAL_USER LOCAL_PASS; do
              printf 'export %s=%q\n' "$v" "${!v}"
            done
            cat .github/scripts/bootstrap.sh
          } | ssh -i key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                "$SSH_USER@$HOST" 'bash -s'

      - name: Check the site over HTTPS
        run: |
          # From the runner, over the public internet — this is the check that
          # actually proves DNS, Caddy and the certificate are all working,
          # which a loopback health check on the server cannot tell you.
          echo "Waiting for the certificate to issue (first request triggers it)..."
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://womp.cottoncandygenocide.ca/api/health || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "https://womp.cottoncandygenocide.ca is live (HTTP $CODE)"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 5
          done
          echo "::error::Site did not answer over HTTPS. Check 'docker compose logs caddy' on the server."
          exit 1
