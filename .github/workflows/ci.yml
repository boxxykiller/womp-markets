name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/eve-market-tracker-thami0

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: womp_markets_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/womp_markets_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/womp_markets_test
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Generate Prisma client
        run: npm run db:generate

      # Run from server/, not the repo root with --prefix: `npm --prefix`
      # changes which package's binaries resolve but NOT the working
      # directory, so Prisma would look for ./prisma/schema.prisma at the
      # root and fail with "Could not find Prisma Schema".
      - name: Push schema to the test database
        working-directory: server
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
